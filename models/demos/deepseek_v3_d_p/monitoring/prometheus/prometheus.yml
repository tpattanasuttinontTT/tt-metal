global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prefill_runner
    metrics_path: /metrics
    static_configs:
      # host.docker.internal resolves to the docker host on Mac/Windows and,
      # via extra_hosts in docker-compose.yml, on Linux too.
      # Match PREFILL_METRICS_PORT that the runner is started with.
      - targets: ["host.docker.internal:9100"]
        labels:
          service: prefill_runner
